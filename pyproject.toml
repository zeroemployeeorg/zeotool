[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeotool"
version = "0.2.0"
description = "A deterministic, local-first ZeoCore tool for copying learning assets."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Rod Rivera", email = "rod@aiproduct.engineer" }]
keywords = ["automation", "learning", "zeocore", "asset-copying"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.6.0", "zeocore==0.5.0"]

[project.optional-dependencies]
dev = ["mypy>=1.8.0", "pytest>=7.0.0", "ruff>=0.2.0"]

[project.urls]
Homepage = "https://github.com/profrodai/zeotool"
Issues = "https://github.com/profrodai/zeotool/issues"

[project.scripts]
zeotool = "zeotool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeotool"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tools/check_whitespace.py" = ["S607"] # fixed Git executable and arguments

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "examples", "tools"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
